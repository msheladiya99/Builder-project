<!DOCTYPE html>
<html>
<head>
  <title>Cross-Domain Storage</title>
</head>
<body>
  <script>
    window.addEventListener("message", function(event) {
      if (!event.origin.includes("localhost") && !event.origin.includes("127.0.0.1")) return;

      const payload = event.data;
      if (!payload || typeof payload !== "object") return;

      if (payload.action === "GET") {
        const data = localStorage.getItem("saas_projects");
        event.source.postMessage({
          action: "GET_RESPONSE",
          data: data
        }, event.origin);
      } else if (payload.action === "SET") {
        localStorage.setItem("saas_projects", payload.data);
        event.source.postMessage({
          action: "SET_RESPONSE",
          success: true
        }, event.origin);
      }
    });
  </script>
</body>
</html>
